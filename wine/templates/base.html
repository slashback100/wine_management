<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cave à Vin{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/wine/">Cave à Vin</a>
        </div>
        <div class="nav-menu">
            <a href="/wine/" class="nav-item" data-page="wines">Vins</a>
            <a href="/wine/stats" class="nav-item" data-page="stats">Statistiques</a>
            <a href="/wine/logout" class="nav-item">Déconnexion</a>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
